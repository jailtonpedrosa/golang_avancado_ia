<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXA — Entrar na sua conta</title>
  <meta name="description" content="Acesse sua conta NEXA de forma rápida e segura." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header__inner">

      <a href="/" class="brand" aria-label="NEXA, ir para a página inicial">
        <svg class="brand__logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M8 24V8L24 24V8" stroke="#1D1D1F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand__name">NEXA</span>
      </a>

      <nav class="nav" aria-label="Navegação principal">
        <ul class="nav__list">
          <li><a href="#" class="nav__link">Produto</a></li>
          <li><a href="#" class="nav__link">Soluções</a></li>
          <li><a href="#" class="nav__link">Preços</a></li>
          <li><a href="#" class="nav__link">Suporte</a></li>
        </ul>
      </nav>

      <div class="header__actions">

        <div class="search" id="search">
          <button type="button" class="search__toggle" id="searchToggle" aria-expanded="false" aria-controls="searchInput" aria-label="Abrir pesquisa">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
              <line x1="16.4" y1="16.4" x2="21" y2="21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
          <input
            type="search"
            id="searchInput"
            class="search__input"
            placeholder="Pesquisar"
            aria-label="Pesquisar no site"
          />
        </div>

        <a href="#login" class="header__login-link">Entrar</a>

        <button type="button" class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="mobileMenu" aria-label="Abrir menu">
          <svg class="icon-menu" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <svg class="icon-close" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>

      </div>
    </div>

    <!-- MOBILE MENU -->
    <nav class="mobile-menu" id="mobileMenu" aria-label="Navegação móvel">
      <ul class="mobile-menu__list">
        <li><a href="#" class="mobile-menu__link">Produto</a></li>
        <li><a href="#" class="mobile-menu__link">Soluções</a></li>
        <li><a href="#" class="mobile-menu__link">Preços</a></li>
        <li><a href="#" class="mobile-menu__link">Suporte</a></li>
        <li><a href="#login" class="mobile-menu__link mobile-menu__link--cta">Entrar</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN -->
  <main class="main" id="login">
    <section class="login-card" aria-labelledby="loginTitle">

      <div class="login-card__icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 24V8L24 24V8" stroke="#1D1D1F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1 class="login-card__title" id="loginTitle">Entrar</h1>
      <p class="login-card__subtitle">Bem-vindo de volta. Entre na sua conta para continuar.</p>

      <form class="login-form" id="loginForm" novalidate>

        <div class="field">
          <label for="email" class="field__label">E-mail</label>
          <div class="field__control">
            <svg class="field__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M3 7l9 6 9-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input
              type="email"
              id="email"
              name="email"
              class="field__input"
              placeholder="seu@email.com"
              autocomplete="email"
              aria-describedby="emailError"
              aria-invalid="false"
            />
          </div>
          <p class="field__error" id="emailError" role="alert"></p>
        </div>

        <div class="field">
          <label for="password" class="field__label">Senha</label>
          <div class="field__control">
            <svg class="field__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input
              type="password"
              id="password"
              name="password"
              class="field__input"
              placeholder="Sua senha"
              autocomplete="current-password"
              aria-describedby="passwordError"
              aria-invalid="false"
            />
            <button type="button" class="field__toggle" id="togglePassword" aria-label="Mostrar senha" aria-pressed="false">
              <svg class="icon-eye-open" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
              </svg>
              <svg class="icon-eye-closed" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c7 0 10.5 7 10.5 7a15.8 15.8 0 0 1-3.4 4.3M6.6 6.6C3.4 8.6 1.5 12 1.5 12S5 19 12 19c1.3 0 2.5-.2 3.6-.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9.9 14.1a3 3 0 0 0 4.2-4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <p class="field__error" id="passwordError" role="alert"></p>
        </div>

        <div class="login-form__row">
          <label class="checkbox">
            <input type="checkbox" id="remember" name="remember" class="checkbox__input" />
            <span class="checkbox__box" aria-hidden="true"></span>
            <span class="checkbox__label">Lembrar de mim</span>
          </label>

          <a href="#" class="link link--muted">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
          <span class="btn-primary__label">Entrar</span>
          <span class="btn-primary__spinner" aria-hidden="true"></span>
        </button>

        <p class="login-form__signup">
          Não tem uma conta? <a href="#" class="link">Criar conta</a>
        </p>

        <div class="divider" role="separator">
          <span class="divider__line"></span>
          <span class="divider__label">ou</span>
          <span class="divider__line"></span>
        </div>

        <button type="button" class="btn-social" id="googleLoginBtn">
          <svg class="btn-social__icon" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.62z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.81.54-1.85.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
          </svg>
          <span class="btn-social__label">Entrar com Google</span>
        </button>

      </form>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer__inner">
      <p class="footer__copy">NEXA © 2026</p>
      <ul class="footer__links">
        <li><a href="#" class="footer__link">Privacidade</a></li>
        <li><a href="#" class="footer__link">Termos de uso</a></li>
        <li><a href="#" class="footer__link">Suporte</a></li>
      </ul>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
